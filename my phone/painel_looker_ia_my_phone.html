<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel My Phone</title><style>body{margin:0;font-family:Arial,sans-serif;background:#1f2024;color:#fff}.tabs{display:flex;background:#111;padding:10px;gap:8px;position:sticky;top:0;z-index:10}.tabs button{background:#2b2d33;color:#fff;border:0;padding:10px 16px;cursor:pointer;font-weight:bold;border-radius:6px}.tabs button.active{background:#fff;color:#111}.tab{display:none;padding:10px}.tab.active{display:block}.zoom-controls{display:flex;align-items:center;gap:10px;margin-bottom:10px;background:#111;padding:10px;border-radius:8px}.zoom-controls button{width:42px;height:36px;border:0;border-radius:6px;background:#fff;color:#111;font-size:22px;font-weight:bold;cursor:pointer}.zoom-controls span{font-weight:bold}.looker-wrap{width:100%;height:calc(100vh - 130px);overflow:auto;background:#fff;border-radius:8px}.looker-scale{width:333.34%;height:5000px;transform:scale(.3);transform-origin:top left}iframe{width:100%;height:5000px;border:0;background:white}.card{background:#2b2d33;padding:18px;border-radius:8px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.metric{font-size:28px;font-weight:bold;color:#4aa3ff}.week-card{background:#2b2d33;border-left:5px solid #4aa3ff;padding:18px;border-radius:8px;margin:14px 0}.week-card h2{margin:0 0 10px}.week-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:12px 0}.week-metrics div{background:#202126;padding:12px;border-radius:6px}.week-metrics strong{display:block;font-size:22px;color:#4aa3ff;margin-top:4px}.week-card p{line-height:1.5;color:#e8e8e8}</style></head><body><div class="tabs"><button class="active" onclick="openTab('looker',this)">Looker Studio</button><button onclick="openTab('ia',this)">Análise Semanal IA</button></div><section id="looker" class="tab active"><div class="zoom-controls"><button onclick="changeZoom(-0.05)">−</button><span>Escala: <strong id="zoomLabel">30%</strong></span><button onclick="changeZoom(0.05)">+</button></div><div class="looker-wrap"><div id="lookerScale" class="looker-scale"><iframe width="600" height="1500" src="https://datastudio.google.com/embed/reporting/6e3a0fc5-0a29-4d41-b755-17ebccb0edb9/page/Nf8SC" frameborder="0" style="border:0" allowfullscreen sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe></div></div></section><section id="ia" class="tab"><h1>Análise Semanal IA - My Phone</h1><p>Últimas 10 semanas, com a semana mais recente sempre no topo.</p><div id="weeklyAnalysis"></div></section><script>let zoom=.3;function applyZoom(){const el=document.getElementById('lookerScale');const label=document.getElementById('zoomLabel');el.style.transform='scale('+zoom+')';el.style.width=(100/zoom)+'%';label.textContent=Math.round(zoom*100)+'%'}function changeZoom(delta){zoom=Math.max(.2,Math.min(1,zoom+delta));applyZoom()}function openTab(id,btn){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));document.getElementById(id).classList.add('active');btn.classList.add('active')}const weeks=[{t:'Semana 2 de maio',p:'04/05/2026 a 10/05/2026',c:206,g:376.62,cp:1.83},{t:'Semana 1 de maio',p:'27/04/2026 a 03/05/2026',c:153,g:374.81,cp:2.45},{t:'Semana 4 de abril',p:'20/04/2026 a 26/04/2026',c:161,g:381.58,cp:2.37},{t:'Semana 3 de abril',p:'13/04/2026 a 19/04/2026',c:110,g:378.98,cp:3.45},{t:'Semana 2 de abril',p:'06/04/2026 a 12/04/2026',c:99,g:307.37,cp:3.10},{t:'Semana 1 de abril',p:'30/03/2026 a 05/04/2026',c:138,g:371.75,cp:2.69},{t:'Semana 4 de março',p:'23/03/2026 a 29/03/2026',c:151,g:425.16,cp:2.82},{t:'Semana 3 de março',p:'16/03/2026 a 22/03/2026',c:169,g:400.25,cp:2.37},{t:'Semana 2 de março',p:'09/03/2026 a 15/03/2026',c:197,g:419.89,cp:2.13},{t:'Semana 1 de março',p:'02/03/2026 a 08/03/2026',c:207,g:420.75,cp:2.03}];function brl(v){return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function analyze(w,i){const prev=weeks[i+1];let txt='';if(!prev){txt='Semana com bom volume de conversas e custo controlado, servindo como base de comparação para as semanas seguintes.'}else{const vc=w.c-prev.c;const pc=((vc/prev.c)*100).toFixed(1).replace('.',',');const cc=w.cp-prev.cp;txt=(vc>=0?'Houve crescimento':'Houve queda')+' de '+Math.abs(vc)+' conversas em relação à semana anterior ('+pc+'%). ';txt+=cc<=0?'O custo por conversa melhorou, indicando ganho de eficiência.':'O custo por conversa subiu, exigindo atenção em criativos, segmentação e orçamento.'}return txt}document.getElementById('weeklyAnalysis').innerHTML=weeks.map((w,i)=>`<article class="week-card"><h2>${w.t}</h2><small>${w.p}</small><div class="week-metrics"><div>Conversas<strong>${w.c}</strong></div><div>Total gasto<strong>${brl(w.g)}</strong></div><div>Custo por conversa<strong>${brl(w.cp)}</strong></div></div><p>${analyze(w,i)}</p></article>`).join('');</script></body></html>
