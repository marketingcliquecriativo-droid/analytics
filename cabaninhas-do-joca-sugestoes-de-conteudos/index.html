<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cabaninhas do Joca | Sugestões de Conteúdos</title>
  <style>
    :root{--bg:#f5efe7;--card:#fffaf3;--text:#3b2f26;--muted:#7a6655;--accent:#d59b55;--accent-dark:#8a5a2b;--shadow:0 24px 70px rgba(59,47,38,.13)}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:radial-gradient(circle at top left,#fff6e8 0,var(--bg) 45%,#e9ddcf 100%);color:var(--text);line-height:1.65}header{padding:54px 22px 28px;text-align:center}h1{margin:0 auto;max-width:940px;font-family:Georgia,'Times New Roman',serif;font-size:clamp(34px,6vw,68px);line-height:1.03;font-weight:500}.tabs-wrap{position:sticky;top:0;z-index:10;background:rgba(245,239,231,.9);backdrop-filter:blur(18px);border-top:1px solid rgba(213,155,85,.2);border-bottom:1px solid rgba(213,155,85,.2);padding:12px;overflow-x:auto;white-space:nowrap}.tabs{display:flex;gap:10px;max-width:1180px;margin:0 auto}button.tab{border:1px solid rgba(213,155,85,.32);background:rgba(255,250,243,.82);color:var(--text);padding:11px 16px;border-radius:999px;cursor:pointer;font-weight:800;transition:.2s ease}button.tab.active,button.tab:hover{background:var(--accent);color:#fff;border-color:var(--accent);transform:translateY(-1px)}main{max-width:1060px;margin:34px auto 70px;padding:0 18px}.panel{display:none;background:rgba(255,250,243,.9);border:1px solid rgba(213,155,85,.22);border-radius:34px;padding:clamp(26px,5vw,58px);box-shadow:var(--shadow);animation:fade .25s ease}.panel.active{display:block}@keyframes fade{from{opacity:.25;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.number{display:inline-flex;align-items:center;gap:10px;color:var(--accent-dark);font-size:13px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;margin-bottom:18px}.number:before{content:'';width:44px;height:1px;background:var(--accent);display:inline-block}h2{font-family:Georgia,'Times New Roman',serif;font-size:clamp(30px,5vw,54px);line-height:1.08;font-weight:500;margin:0 0 28px;color:var(--text)}h3{margin-top:32px;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-dark)}p{font-size:18px;color:var(--text)}.caption,.package-box{margin-top:18px;padding:28px;border-radius:24px;background:linear-gradient(135deg,rgba(234,216,189,.75),rgba(255,255,255,.58));border:1px solid rgba(213,155,85,.24);color:var(--text);white-space:pre-line;font-size:18px}.package-list{display:grid;gap:14px;margin-top:20px}.package-item{padding:18px 20px;border-radius:18px;background:rgba(255,250,243,.82);border:1px dashed rgba(138,90,43,.3)}.package-item strong{color:var(--accent-dark)}.blank{color:#a39386;font-style:italic}footer{text-align:center;padding:34px 18px 46px;color:var(--muted);font-weight:800}@media(max-width:640px){header{padding-top:36px}p,.caption,.package-box{font-size:16px}.panel{border-radius:24px}button.tab{padding:10px 13px;font-size:13px}}
  </style>
</head>
<body>
<header><h1>Sugestão de Conteúdos - Cabaninhas do Joca</h1></header>
<nav class="tabs-wrap"><div class="tabs" id="tabs"></div></nav><main id="content"></main><footer>Clique Criativo I Marketing Estratégico - +55 (81) 8489 - 7234</footer>
<script>
const pacoteAtual={t:'Pacote Atual',html:`<div class="number">Acompanhamento</div><h2>Cabaninhas do Joca - Pacote</h2><h3>Conteúdos criados</h3><div class="package-list"><div class="package-item"><strong>1. Reels:</strong> cada festa do pijama é pensada para encantar.</div><div class="package-item"><strong>2. Carrossel:</strong> 15 anos comemorados com um picniver.</div><div class="package-item"><strong>3. Reels:</strong> a gente cresce, mas a vontade de reunir amigos...</div><div class="package-item blank"><strong>4.</strong> Em branco para preenchimento.</div><div class="package-item blank"><strong>5.</strong> Em branco para preenchimento.</div><div class="package-item blank"><strong>6.</strong> Em branco para preenchimento.</div><div class="package-item blank"><strong>7.</strong> Em branco para preenchimento.</div><div class="package-item blank"><strong>8.</strong> Em branco para preenchimento.</div></div><div class="package-box"><strong>Faltam +5 conteúdos</strong></div>`};
const temas=[
{t:'A cabaninha que vira o cantinho mais disputado da festa.',d:'Esse conteúdo deve mostrar que a cabaninha não é apenas um item de decoração. Dentro de uma festa infantil, ela vira cenário, brincadeira, esconderijo, espaço de descanso e ponto de encantamento para as crianças. A abordagem ideal é usar imagens de festas reais, mostrando a cabaninha montada no ambiente, com almofadas, bandeirinhas, tapetes e detalhes do tema. O texto deve reforçar que, quando existe um espaço pensado para elas, as crianças participam mais da festa e criam lembranças de verdade.',l:'Toda festa infantil tem aquele cantinho que chama atenção das crianças.\n\nE quando tem cabaninha, esse cantinho vira cenário de brincadeira, foto, imaginação e muita história.\n\nNão é só decoração.\nÉ um espaço criado para a criança viver a festa do jeitinho dela.'},
{t:'Cabaninha de dormir: a festa do pijama que sai do básico.',d:'Aqui o foco é um dos serviços que aparece com força no perfil: cabaninha de dormir básica ou completa. O conteúdo deve explicar a diferença de transformar uma noite comum em uma experiência organizada, bonita e segura para receber amigos. A ideia é fugir do genérico “festa do pijama” e mostrar a cena pronta: cabaninhas alinhadas, luzinhas, colchões, almofadas, bandeirinhas e detalhes personalizados. Funciona muito bem com antes e depois da montagem.',l:'Uma noite de pijama pode ser muito mais do que colchões espalhados pela sala.\n\nCom as cabaninhas, tudo ganha clima de festa, cuidado e encantamento.\n\nLuzinhas, almofadas, detalhes personalizados e aquele cenário que faz as crianças entrarem na brincadeira antes mesmo da festa começar.'},
{t:'Piquenique ao ar livre com cara de festa personalizada.',d:'Esse tema deve aproveitar os conteúdos já vistos no perfil sobre piqueniques em área externa, gramado e parque público. A proposta é mostrar que o piquenique não precisa ser improvisado. Ele pode ter mesa baixa, toalhas, almofadas, cabaninhas, decoração temática e espaço confortável para as crianças. O conteúdo deve vender o desejo de comemorar de um jeito leve, bonito e afetivo, ideal para aniversários, encontros e pequenas celebrações.',l:'Piquenique infantil não precisa ser improviso.\n\nPode ter tema.\nPode ter mesa linda.\nPode ter cabaninha, almofadas, toalhas, detalhes e aquele cenário gostoso para brincar e comemorar ao ar livre.\n\nUma festa leve, afetiva e cheia de charme.'},
{t:'Espaço kids bonito para as crianças brincarem enquanto os adultos aproveitam.',d:'Esse conteúdo conversa com eventos em que a cabaninha e os elementos infantis funcionam como espaço kids. A dor do público é clara: em festa com adultos, casamento, aniversário ou confraternização, as crianças precisam de um lugar pensado para elas. O texto deve mostrar que o espaço kids pode ser bonito, organizado e integrado à decoração do evento, sem parecer bagunçado ou improvisado.',l:'Em festa com criança, ter um espaço pensado para elas muda tudo.\n\nEnquanto os adultos aproveitam, os pequenos têm um cantinho bonito, confortável e cheio de possibilidades para brincar.\n\nCabaninhas, tapetes, almofadas e detalhes que deixam o evento mais acolhedor para todo mundo.'},
{t:'Neon Party: quando a festa do pijama ganha energia de baladinha infantil.',d:'O perfil mostra conteúdos de Neon Party, então este tema deve explorar a versão mais divertida e visual da marca. A ideia é apresentar a festa neon como opção para crianças maiores ou para quem quer sair dos temas tradicionais. O texto pode falar sobre luzes, cores, clima de festa, fotos marcantes e a sensação de surpresa quando a criança entra no ambiente montado.',l:'Tem criança que ama uma festa diferente.\n\nA Neon Party transforma a cabaninha em uma experiência cheia de cor, luz e diversão.\n\nÉ festa do pijama, mas com clima de baladinha infantil, cenário marcante e aquele brilho nos olhos quando elas veem tudo pronto.'},
{t:'Roteiro afetivo: 5 parques em BH para fazer uma festa piquenique.',d:'Esse conteúdo traz uma abordagem mais útil e compartilhável. A ideia é criar um carrossel ou Reels com sugestões de parques e áreas verdes de Belo Horizonte onde as famílias costumam buscar programas ao ar livre, sempre com o cuidado de orientar a conferir regras, autorização e estrutura antes da montagem. O conteúdo pode citar Parque Municipal, Parque das Mangabeiras, Parque Ecológico da Pampulha, Praça do Papa e Parque Jacques Cousteau como inspiração de roteiro, conectando com a ideia de piquenique personalizado, cabaninhas, toalhas, almofadas e cenário infantil. A proposta é gerar salvamento e compartilhamento, porque vira uma dica prática para mães de BH.',l:'Salva essa ideia para o próximo aniversário ao ar livre.\n\nBH tem lugares lindos para viver uma comemoração com cara de infância: gramado, sombra, toalhas, cabaninhas, brincadeira e aquele clima leve de piquenique.\n\nAntes de escolher o local, vale conferir regras, autorização e estrutura do espaço.\n\nMas uma coisa é certa: quando o cenário é pensado com carinho, até uma festa simples vira memória.'},
{t:'Ensaio fotográfico com cenário que parece história de criança.',d:'O perfil mostra ensaios fotográficos, por isso este conteúdo deve posicionar as cabaninhas como cenário para fotos afetivas. A ideia é mostrar que, além de festas, as cabaninhas funcionam para registrar fases importantes: aniversário, mesversário, ensaio de família ou datas especiais. O texto deve destacar que a criança se sente dentro de uma história, deixando as fotos mais naturais e expressivas.',l:'Algumas fotos ficam bonitas.\nOutras guardam uma fase inteira.\n\nCom as cabaninhas, o ensaio ganha cenário, aconchego e um toque de imaginação.\n\nA criança brinca, interage, se sente à vontade… e as fotos acontecem com mais verdade.'},
{t:'O mapa das memórias: onde montar uma cabaninha em BH?',d:'Esse tema traz um conteúdo mais inovador, com potencial de engajamento por comentário. A ideia é convidar o público a participar: “qual lugar de BH combina com uma festa piquenique?”. Pode virar post interativo, Reels com cortes de montagens em diferentes ambientes ou carrossel com categorias: parque, quintal, salão de festas, área gourmet, praça autorizada, escola e condomínio. O foco é mostrar versatilidade sem cair no genérico, usando a realidade da Cabaninhas: a festa se adapta ao espaço e transforma o ambiente em cenário afetivo.',l:'BH tem muito lugar que pode virar cenário de memória.\n\nUm parque.\nUm quintal.\nUm salão de festas.\nA área do condomínio.\nUm cantinho verde que combina com piquenique.\n\nA pergunta é: onde você montaria uma cabaninha para comemorar?\n\nComenta aqui um lugar de BH que combina com uma festa ao ar livre.'},
{t:'Festa pequena também merece cenário bonito.',d:'Esse conteúdo é importante porque fala com mães que talvez não estejam planejando uma grande festa, mas querem fazer algo especial em casa, no salão, no quintal ou em um parque. A abordagem deve mostrar que a Cabaninhas resolve a decoração afetiva de forma prática, levando estrutura, composição e encanto mesmo para celebrações menores. O foco é quebrar a objeção de que cabaninha é só para festa grande.',l:'Não precisa ser uma festa enorme para ser especial.\n\nÀs vezes, uma comemoração pequena, com um cenário bem pensado, já vira uma lembrança linda.\n\nA cabaninha transforma sala, quintal, salão ou parque em um cantinho de celebração com cara de infância.'},
{t:'O tema da festa pode virar uma experiência, não só uma decoração.',d:'Esse tema deve mostrar a força da personalização. A Cabaninhas pode adaptar o cenário ao tema escolhido: cores, bandeirinhas, almofadas, tapetes, itens de mesa, clima de piquenique, festa do pijama ou espaço kids. O texto deve explicar que decorar é bonito, mas criar uma experiência faz a criança entrar de verdade no universo da festa.',l:'Quando o tema da festa aparece só na mesa, ele decora.\n\nMas quando aparece no espaço onde a criança brinca, deita, imagina e tira fotos, ele vira experiência.\n\nA cabaninha ajuda a transformar o tema em um cantinho vivo dentro da festa.'}
];
const tabs=document.getElementById('tabs');const content=document.getElementById('content');
const all=[pacoteAtual,...temas];all.forEach((item,i)=>{const b=document.createElement('button');b.className='tab'+(i===0?' active':'');b.textContent=i===0?'Pacote Atual':'Tema '+i;b.onclick=()=>show(i);tabs.appendChild(b);const s=document.createElement('section');s.className='panel'+(i===0?' active':'');if(i===0){s.innerHTML=item.html}else{s.innerHTML=`<div class="number">Tema ${i}</div><h2>${item.t}</h2><h3>Descrição detalhada</h3><p>${item.d}</p><h3>Legenda</h3><div class="caption">${item.l}</div>`}content.appendChild(s)});function show(i){document.querySelectorAll('.tab').forEach((e,k)=>e.classList.toggle('active',k===i));document.querySelectorAll('.panel').forEach((e,k)=>e.classList.toggle('active',k===i));window.scrollTo({top:document.querySelector('.tabs-wrap').offsetTop,behavior:'smooth'})}
</script></body></html>
