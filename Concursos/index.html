<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Concursos | Disciplinas</title>
  <style>
    :root { --bg:#0f1020; --card:#181a2f; --text:#f4f5ff; --muted:#b8bddb; --accent:#7c4dff; --line:#2b2e52; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial, sans-serif; background:linear-gradient(135deg,#0f1020,#24134d); color:var(--text); }
    header { padding:32px 20px; text-align:center; border-bottom:1px solid var(--line); }
    header h1 { margin:0 0 8px; font-size:clamp(28px,5vw,46px); }
    header p { margin:0; color:var(--muted); }
    main { max-width:1100px; margin:0 auto; padding:24px 16px 48px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; }
    .card { background:rgba(24,26,47,.94); border:1px solid var(--line); border-radius:18px; padding:20px; box-shadow:0 12px 32px rgba(0,0,0,.22); }
    .card h2 { margin:0 0 10px; }
    .card p { color:var(--muted); line-height:1.5; }
    a.button { display:inline-block; margin-top:10px; background:var(--accent); color:#fff; text-decoration:none; padding:10px 14px; border-radius:12px; font-weight:700; }
    footer { text-align:center; color:var(--muted); padding:24px; }
  </style>
</head>
<body>
  <header>
    <h1>Concursos</h1>
    <p>Página raiz para navegar pelas disciplinas e matérias.</p>
  </header>
  <main>
    <section class="grid" aria-label="Disciplinas">
      <article class="card">
        <h2>Administração Geral</h2>
        <p>Acesse as aulas e matérias organizadas em abas por assunto.</p>
        <a class="button" href="Disciplinas/Administração Geral/index.html">Abrir disciplina</a>
      </article>
    </section>
  </main>
  <footer>Concursos • Disciplinas</footer>
</body>
</html>
