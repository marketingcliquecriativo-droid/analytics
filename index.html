function esc(value){return String(value??'').replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]})}
function fallbackHtml(title,format){return '<div class="fallback-thumb"><strong>'+esc(title||'Conteúdo do Instagram')+'</strong><span>Miniatura não carregou pelo bloqueio temporário do Instagram.</span><small>Clique para abrir o post</small></div><span class="badge">'+esc(format||'Post')+'</span>'}
function media(post){const img=esc(post.img||'');const title=esc(post.t||'Conteúdo do Instagram');const format=esc(post.f||'Post');if(!img){return fallbackHtml(title,format)}return '<img src="'+img+'" alt="'+title+'" loading="lazy" referrerpolicy="no-referrer" onerror="showFallback(this)"><span class="badge">'+format+'</span>'}
function showFallback(imgEl){const thumb=imgEl.closest('.thumb');if(!thumb)return;thumb.innerHTML=fallbackHtml(thumb.dataset.title,thumb.dataset.format)}
function getBaseUrl(){return window.location.href.split('#')[0]}
function openClientInNewTab(id){window.open(getBaseUrl()+'#'+encodeURIComponent(id),'_blank','noopener')}
function activateClient(id,updateHash){const selected=document.getElementById(id)||document.getElementById(clients[0].id);if(!selected)return;document.querySelectorAll('.tab-content').forEach(function(t){t.classList.remove('active')});document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active')});selected.classList.add('active');const tab=document.querySelector('.tab-btn[data-client-id="'+selected.id+'"]');if(tab)tab.classList.add('active');if(updateHash){history.replaceState(null,'','#'+selected.id)}}
function renderLinks(){document.getElementById('client-links').innerHTML=clients.map(function(client){return '<button type="button" class="client-link-btn" data-open-client-id="'+esc(client.id)+'">Abrir '+esc(client.name)+'</button>'}).join('')}
function renderTabs(){document.getElementById('tabs').innerHTML=clients.map(function(client,index){return '<button type="button" class="tab-btn '+(index===0?'active':'')+'" data-client-id="'+esc(client.id)+'">'+esc(client.name)+'</button>'}).join('')}
function renderPosts(posts){return posts.map(function(post){return '<div class="content-box"><a href="'+esc(post.url)+'" target="_blank" rel="noopener"><div class="thumb" data-title="'+esc(post.t)+'" data-format="'+esc(post.f)+'">'+media(post)+'</div></a><div class="content-info"><h3>'+esc(post.t)+'</h3><div class="meta">'+esc(post.d)+' • '+esc(post.e)+' interações'+(post.p?' • '+esc(post.p):'')+'</div><a class="post-link" href="'+esc(post.url)+'" target="_blank" rel="noopener">Abrir post →</a></div></div>'}).join('')}
function renderIdeas(ideas){return ideas.map(function(item){const parts=String(item).split('|');return '<div class="idea-card"><h4>'+esc(parts[0]||'')+'</h4><p>'+esc(parts.slice(1).join('|')||'')+'</p></div>'}).join('')}
function renderApp(){document.getElementById('app').innerHTML=clients.map(function(client,index){return '<div id="'+esc(client.id)+'" class="tab-content '+(index===0?'active':'')+'"><div class="card"><span class="tag">Top 5 conteúdos</span><h2>'+esc(client.name)+'</h2><p class="note">'+esc(client.note)+'</p><div class="top-grid">'+renderPosts(client.posts)+'</div></div><div class="card"><span class="tag">Sugestões estratégicas</span><h2>10 novos conteúdos + abordagem</h2><div class="ideas">'+renderIdeas(client.ideas)+'</div></div></div>'}).join('')}
function bindEvents(){document.getElementById('client-links').addEventListener('click',function(event){const button=event.target.closest('[data-open-client-id]');if(button){openClientInNewTab(button.dataset.openClientId)}});document.getElementById('tabs').addEventListener('click',function(event){const button=event.target.closest('[data-client-id]');if(button){activateClient(button.dataset.clientId,true)}});window.addEventListener('hashchange',function(){activateClient(decodeURIComponent(window.location.hash.replace('#','')),false)})}
function runTests(){console.assert(Array.isArray(clients),'clients deve ser array');console.assert(clients.length===6,'deve ter 6 perfis');console.assert(clients.every(function(c){return c.id&&c.name&&Array.isArray(c.posts)&&c.posts.length>0}),'todos os clientes devem ter posts');console.assert(clients.every(function(c){return Array.isArray(c.ideas)&&c.ideas.length===10}),'todos os clientes devem ter 10 ideias');console.assert(typeof openClientInNewTab==='function','função de abrir cliente deve existir');console.assert(!document.documentElement.outerHTML.includes('c.id'), 'não pode existir referência inline a c.id no HTML renderizado')}
function init(){renderLinks();renderTabs();renderApp();bindEvents();const hash=decodeURIComponent(window.location.hash.replace('#',''));if(hash){activateClient(hash,false)}runTests()}
init();
</script>
</body>
</html>
