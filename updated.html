<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Relatórios Instagram</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}body{background:#f3f4f6;color:#111827}.header{background:linear-gradient(135deg,#111827,#1f2937);color:white;padding:36px}.header h1{font-size:34px;margin-bottom:8px}.header p{color:#d1d5db}.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.links a{background:rgba(255,255,255,.14);color:#fff;text-decoration:none;padding:10px 14px;border-radius:12px;font-weight:700}.tabs{display:flex;gap:10px;overflow-x:auto;padding:18px;background:white;position:sticky;top:0;z-index:5}.tabs button{border:0;background:#e5e7eb;padding:12px 16px;border-radius:12px;font-weight:700;cursor:pointer}.tabs button.active{background:#111827;color:#fff}.page{display:none;padding:32px}.page.active{display:block}.card{background:white;border-radius:22px;padding:28px;margin-bottom:28px;box-shadow:0 10px 30px rgba(0,0,0,.06)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}.post,.idea{border:1px solid #e5e7eb;border-radius:18px;background:#fff;overflow:hidden}.thumb{height:220px;background:linear-gradient(135deg,#111827,#374151);color:white;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px}.info{padding:18px}.info h3,.idea h3{font-size:17px;line-height:1.4;margin-bottom:10px}.meta{font-size:13px;color:#6b7280;line-height:1.7}.idea{padding:20px;background:#fafafa}.idea p{font-size:14px;color:#4b5563;line-height:1.7;margin-top:8px}.tag{display:inline-block;background:#eef2ff;color:#4338ca;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;margin-bottom:12px}.btn{display:inline-block;margin-top:12px;color:#111827;font-weight:700;text-decoration:none}@media(max-width:768px){.page{padding:18px}.header h1{font-size:25px}}</style></head><body><header class="header"><h sc(p[2])+' • '+esc(p[3])+' interações</div><a class="btn" href="'+p[4]+'" target="_blank">Abrir post →</a></div></div>'}function ideaCard(s){let p=s.split('|');return '<div class="idea"><h3>'+esc(p[0])+'</h3><p>'+esc(p[1]||'')+'</p></div>'}function init(){document.getElementById('links').innerHTML=clients.map(c=>'<a href="#'+c.id+'" target="_blank">Abrir '+esc(c.name)+'</a>').join('');document.getElementById('tabs').innerHTML=clients.map((c,i)=>'<button data-id="'+c.id+'" class="'+(i==0?'active':'')+'" onclick="openTab(\''+c.id+'\')">'+esc(c.name)+'</button>').join('');document.getElementById('app').innerHTML=clients.map((c,i)=>'<section id="'+c.id+'" class="page '+(i==0?'active':'')+'"><div class="card"><span class="tag">Top 5 conteúdos</span><h2>'+esc(c.name)+'</h2><div class="grid">'+c.posts.map(postCard).join('')+'</div></div><div class="card"><span class="tag">Sugestões estratégicas</span><h2>10 novos conteúdos + abordagem</h2><div class="grid">'+c.ideas.map(ideaCard).join('')+'</div></div></section>').join('');if(location.hash&&document.getElementById(location.hash.slice(1)))openTab(location.hash.slice(1))}init();</script></body></html>
