<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin Agenda Quinlalazim</title><style>:root{--teal:#148990;--orange:#ff7a18}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f6f7;color:#173b2b;padding:24px}.wrap{max-width:1200px;margin:auto}.top{background:#fff;border-radius:22px;padding:24px;box-shadow:0 10px 30px #0001;margin-bottom:24px}.top h1{margin:0;color:var(--teal)}.months{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}.month{background:#fff;border-radius:20px;padding:18px;box-shadow:0 10px 30px #0001}.month h2{margin-top:0;color:var(--orange)}.checks{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.checks label{background:#edf1f2;border-radius:10px;text-align:center;padding:10px 0;font-weight:800;cursor:pointer;transition:.2s}.checks label.on{background:var(--orange);color:#fff}.checks input{display:none}@media(max-width:700px){body{padding:12px}.checks{grid-template-columns:repeat(5,1fr)}}</style></head><body><div class="wrap"><div class="top"><h1>Área do Administrador</h1><p>Marque as datas indisponíveis. O calendário público usa os mesmos dados salvos no navegador.</p><p><a href="./index.html">Abrir agenda pública</a></p></div><div class="months" id="months"></div></div><script>const config={maio:{label:'Maio',days:31,busy:[2,7,16,22,23,24,31]},junho:{label:'Junho',days:30,busy:[5,27]},julho:{label:'Julho',days:31,busy:[3,10,18]},agosto:{label:'Agosto',days:31,busy:[]},setembro:{label:'Setembro',days:30,busy:[]},outubro:{label:'Outubro',days:31,busy:[]},novembro:{label:'Novembro',days:30,busy:[]},dezembro:{label:'Dezembro',days:31,busy:[]}};function getBusy(m){return JSON.parse(localStorage.getItem('busy_'+m)||JSON.stringify(config[m].busy))}function setBusy(m,a){localStorage.setItem('busy_'+m,JSON.stringify(a))}function render(){const months=document.getElementById('months');months.innerHTML='';Object.keys(config).forEach(key=>{let c=config[key],busy=getBusy(key),html=`<div class="month"><h2>${c.label}</h2><div class="checks">`;for(let d=1;d<=c.days;d++){html+=`<label class="${busy.includes(d)?'on':''}"><input type="checkbox" ${busy.includes(d)?'checked':''} onchange="toggleDay('${key}',${d},this)">${d}</label>`}html+=`</div></div>`;months.insertAdjacentHTML('beforeend',html)})}function toggleDay(m,d,el){let arr=getBusy(m);arr=el.checked?[...new Set([...arr,d])]:arr.filter(x=>x!==d);arr.sort((a,b)=>a-b);setBusy(m,arr);render()}render();</script></body></html>
