<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Agenda Quinlalazim</title><style>:root{--teal:#148990;--teal2:#075a60;--orange:#ff7a18;--cream:#fffaf0;--green:#0b2f13;--soft:#d9ddb0}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#fff;background:#123b16;min-height:100vh;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(6,35,15,.25),rgba(6,35,15,.88)),url('https://images.unsplash.com/photo-1520412099551-62b6bafeb5bb?auto=format&fit=crop&w=1600&q=80') center/cover;z-index:-2}body:after{content:"";position:fixed;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.04),rgba(8,45,20,.5));z-index:-1}.page{width:min(1180px,96vw);margin:auto;min-height:100vh;display:flex;flex-direction:column;padding:18px 0 24px}.top{text-align:center;padding:4px 10px 10px}.top h1{margin:0;color:#fff;font-size:clamp(32px,5vw,58px);line-height:.95;font-family:Georgia,serif;font-style:italic;font-weight:400}.top h1 span{display:block;color:var(--orange);font-family:Arial,Helvetica,sans-serif;font-style:normal;font-size:.9em;font-weight:900}.top p{margin:8px auto 0;max-width:720px;font-size:clamp(14px,1.7vw,18px);line-height:1.3}.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0 14px}.tabs button{border:0;border-radius:999px;background:#ffffffee;color:var(--teal2);padding:10px 18px;font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 8px 18px #0002}.tabs button.active{background:var(--orange);color:#fff}.content{flex:1;display:flex;align-items:flex-start;justify-content:center}.month{display:none;width:100%}.month.active{display:block}.month-title{width:fit-content;margin:0 auto 10px;background:#168d94dd;border-radius:14px;padding:12px 52px;font-size:clamp(24px,3.5vw,40px);font-weight:900}.calendar{width:min(940px,100%);margin:auto;background:rgba(255,250,240,.97);color:var(--teal2);border-radius:24px;padding:14px 18px 12px;box-shadow:0 24px 70px #0007}.week{display:grid;grid-template-columns:repeat(7,1fr)}.dow{text-align:center;font-weight:900;font-size:clamp(12px,1.6vw,18px);padding:8px 4px}.grid{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid #ddd;border-left:1px solid #ddd}.cell{height:clamp(54px,8.2vh,82px);border-right:1px solid #ddd;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:center;font-size:clamp(21px,3.1vw,34px);font-weight:800;position:relative}.cell.empty{background:#fff8}.cell.busy span{background:var(--soft);width:clamp(42px,6vw,58px);height:clamp(42px,6vw,58px);border-radius:50%;display:flex;align-items:center;justify-content:center}.cell.busy:after{content:"🎉";position:absolute;right:10px;bottom:8px;font-size:clamp(15px,2vw,22px)}.legend{display:flex;align-items:center;justify-content:center;gap:9px;font-weight:800;margin-top:10px;font-size:15px}.dot{width:24px;height:24px;border-radius:50%;background:var(--soft)}.whats{text-align:center;margin-top:12px}.whats a{display:inline-flex;align-items:center;gap:8px;background:var(--orange);color:#fff;text-decoration:none;border-radius:999px;padding:12px 22px;font-weight:900}@media(max-width:680px){.page{width:96vw;padding:10px 0 18px}.top{padding-top:4px}.tabs{justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap;padding-bottom:5px}.tabs button{white-space:nowrap;padding:9px 14px}.month-title{padding:10px 25px}.calendar{padding:10px 8px}.cell{height:54px}.legend{font-size:12px}.cell.busy:after{right:3px;bottom:4px}}</style></head><body><main class="page"><header class="top"><h1>Nossa <span>agenda</span></h1><p>Clique no mês que deseja reservar o Quintaalzim e confira os horários disponíveis.</p></header><nav class="tabs" id="tabs"></nav><section class="content" id="months"></section><div class="whats"><a href="https://wa.me/553192526643" target="_blank">Reserve a sua data</a></div></main><script>const config={maio:{label:'Maio',days:31,start:5,busy:[2,7,16,22,23,24,31]},junho:{label:'Junho',days:30,start:1,busy:[5,27]},julho:{label:'Julho',days:31,start:3,busy:[3,10,18]},agosto:{label:'Agosto',days:31,start:6,busy:[]},setembro:{label:'Setembro',days:30,start:2,busy:[]},outubro:{label:'Outubro',days:31,start:4,busy:[]},novembro:{label:'Novembro',days:30,start:0,busy:[]},dezembro:{label:'Dezembro',days:31,start:2,busy:[]}};function getBusy(m){return JSON.parse(localStorage.getItem('busy_'+m)||JSON.stringify(config[m].busy))}function render(){const tabs=document.getElementById('tabs'),months=document.getElementById('months');tabs.innerHTML='';months.innerHTML='';Object.keys(config).forEach((key,i)=>{let c=config[key],busy=getBusy(key);tabs.insertAdjacentHTML('beforeend',`<button class="${i==0?'active':''}" onclick="showMonth('${key}',this)">${c.label}</button>`);let html=`<div class="month ${i==0?'active':''}" data-month="${key}"><div class="month-title">Agenda de ${c.label}</div><div class="calendar"><div class="week">${['DOM','SEG','TER','QUA','QUI','SEX','SÁB'].map(d=>`<div class="dow">${d}</div>`).join('')}</div><div class="grid">`;for(let e=0;e<c.start;e++)html+=`<div class="cell empty"></div>`;for(let d=1;d<=c.days;d++){let b=busy.includes(d);html+=`<div class="cell ${b?'busy':''}"><span>${d}</span></div>`}html+=`</div><div class="legend"><span class="dot"></span>🎉 Datas indisponíveis / eventos confirmados</div></div></div>`;months.insertAdjacentHTML('beforeend',html)})}function showMonth(m,btn){document.querySelectorAll('.month').forEach(x=>x.classList.remove('active'));document.querySelector(`[data-month="${m}"]`).classList.add('active');document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}render();</script></body></html>
