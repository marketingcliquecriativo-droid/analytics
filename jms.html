<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análise de Campanhas — Facebook Ads</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script>
  // Fallback: se o CDN principal (jsdelivr) falhar ao carregar, tenta um segundo CDN (cdnjs)
  if (typeof Chart === 'undefined') {
    document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"><\/script>');
  }
</script>
<style>
  :root{
    --bg-page:#0b0e14;
    --bg-panel:#11151d;
    --bg-card:#161b25;
    --border:#222938;
    --blue:#2e8fff;
    --blue-soft:#1d4ed8;
    --teal:#22d3c5;
    --amber:#f5a623;
    --text-hi:#f3f5f9;
    --text-mid:#9aa4b8;
    --text-low:#5d6678;
    --good:#3ddc97;
    --bad:#ff5d6c;
    --radius:14px;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  @font-face{
    font-family:'Inter';
    src:local('Inter');
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(circle at 15% 0%, #121826 0%, var(--bg-page) 45%);
    color:var(--text-hi);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }

  /* ---------- TOP BAR ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:22px clamp(16px,4vw,48px) 14px;
    border-bottom:1px solid var(--border);
    flex-wrap:wrap;
    gap:14px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .brand .mark{
    width:42px;height:42px;border-radius:11px;
    background:linear-gradient(135deg,var(--blue) 0%, var(--teal) 130%);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:16px;color:#0b0e14;
    box-shadow:0 0 0 1px rgba(255,255,255,.06), 0 8px 18px -6px rgba(46,143,255,.55);
  }
  .brand h1{
    font-size:15px;
    letter-spacing:.06em;
    text-transform:uppercase;
    font-weight:700;
    margin:0;
    color:var(--text-hi);
  }
  .brand span.sub{
    display:block;
    font-size:12px;
    color:var(--text-mid);
    letter-spacing:.03em;
    margin-top:2px;
    font-weight:500;
    text-transform:none;
  }

  .refresh-row{display:flex;align-items:center;gap:12px;}
  .last-sync{
    font-family:var(--mono);
    font-size:11.5px;
    color:var(--text-low);
    white-space:nowrap;
  }
  .btn-refresh{
    display:flex;align-items:center;gap:8px;
    background:var(--bg-card);
    border:1px solid var(--border);
    color:var(--text-hi);
    font-size:13px;
    font-weight:600;
    padding:9px 16px;
    border-radius:10px;
    cursor:pointer;
    transition:.15s ease;
  }
  .btn-refresh:hover{border-color:var(--blue);color:var(--blue);}
  .btn-refresh svg{width:14px;height:14px;transition:transform .5s ease;}
  .btn-refresh.spinning svg{animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- CLIENT TABS ---------- */
  .tabs-wrap{
    padding:18px clamp(16px,4vw,48px) 0;
  }
  .tabs{
    display:flex;
    gap:6px;
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:5px;
    width:fit-content;
  }
  .tab-btn{
    appearance:none;
    border:none;
    background:transparent;
    color:var(--text-mid);
    font-size:13.5px;
    font-weight:700;
    letter-spacing:.02em;
    padding:10px 20px;
    border-radius:9px;
    cursor:pointer;
    transition:.18s ease;
    display:flex;
    align-items:center;
    gap:9px;
  }
  .tab-btn .dot{width:7px;height:7px;border-radius:50%;background:var(--text-low);transition:.18s ease;}
  .tab-btn.active{
    background:linear-gradient(135deg, var(--blue-soft), var(--blue));
    color:#fff;
    box-shadow:0 6px 16px -6px rgba(46,143,255,.55);
  }
  .tab-btn.active .dot{background:#fff;}
  .tab-btn:not(.active):hover{color:var(--text-hi);}

  /* ---------- MAIN ---------- */
  main{padding:22px clamp(16px,4vw,48px) 60px;}
  .client-panel{display:none;}
  .client-panel.active{display:block;animation:fadein .25s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);} to{opacity:1;transform:translateY(0);}}

  .section-label{
    display:flex;align-items:center;gap:10px;
    font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
    color:var(--text-mid);
    margin:30px 0 14px;
  }
  .section-label::after{content:'';flex:1;height:1px;background:var(--border);}
  .section-label.first{margin-top:6px;}

  /* ---------- FILTER BAR ---------- */
  .filterbar{
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px 18px;
  }
  .filterbar .field{
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  .filterbar label{
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--text-low);
  }
  .filterbar input[type=date]{
    background:var(--bg-card);
    border:1px solid var(--border);
    color:var(--text-hi);
    font-family:var(--mono);
    font-size:13px;
    padding:8px 10px;
    border-radius:8px;
    color-scheme:dark;
  }
  .filterbar input[type=date]:focus{outline:2px solid var(--blue);outline-offset:1px;}
  .presets{display:flex;gap:6px;flex-wrap:wrap;align-self:flex-end;}
  .chip{
    background:var(--bg-card);
    border:1px solid var(--border);
    color:var(--text-mid);
    font-size:12px;
    font-weight:600;
    padding:7px 13px;
    border-radius:20px;
    cursor:pointer;
    transition:.15s ease;
  }
  .chip:hover{color:var(--text-hi);border-color:var(--blue);}
  .chip.active{background:var(--blue);border-color:var(--blue);color:#fff;}
  .filter-status{
    margin-left:auto;
    font-family:var(--mono);
    font-size:12px;
    color:var(--text-low);
    align-self:flex-end;
  }

  /* ---------- KPI CARDS ---------- */
  .kpi-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    margin-top:16px;
  }
  @media (max-width:900px){.kpi-grid{grid-template-columns:repeat(2,1fr);}}
  .kpi-card{
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px 20px;
    position:relative;
    overflow:hidden;
  }
  .kpi-card::before{
    content:'';
    position:absolute;top:0;left:0;width:3px;height:100%;
    background:var(--accent,var(--blue));
  }
  .kpi-label{
    font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    color:var(--text-low);
    margin-bottom:8px;
  }
  .kpi-value{
    font-size:30px;
    font-weight:800;
    font-family:var(--mono);
    color:var(--text-hi);
    line-height:1;
  }
  .kpi-value sup{font-size:15px;color:var(--text-mid);font-weight:600;margin-right:2px;}

  /* ---------- CHART PANELS ---------- */
  .chart-panel{
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px 18px 8px;
    margin-top:6px;
  }
  .chart-panel .legend-row{
    display:flex;gap:18px;flex-wrap:wrap;
    margin-bottom:10px;padding:0 6px;
    font-size:12.5px;color:var(--text-mid);font-weight:600;
  }
  .legend-row .item{display:flex;align-items:center;gap:7px;}
  .legend-row .swatch{width:11px;height:11px;border-radius:3px;}
  .legend-row .swatch.line{border-radius:50%;width:9px;height:9px;}
  .chart-canvas-wrap{position:relative;height:340px;}
  .chart-canvas-wrap.short{height:300px;}

  .state-msg{
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:10px;
    height:300px;
    color:var(--text-mid);
    font-size:13.5px;
    text-align:center;
    padding:0 30px;
  }
  .state-msg.show{display:flex;}
  .state-msg .spinner{
    width:26px;height:26px;border-radius:50%;
    border:3px solid var(--border);border-top-color:var(--blue);
    animation:spin .8s linear infinite;
  }
  .state-msg a{color:var(--blue);text-decoration:none;font-weight:600;}
  .state-msg code{
    background:var(--bg-card);
    padding:2px 6px;border-radius:5px;
    font-family:var(--mono);font-size:12px;
    color:var(--amber);
  }

  footer{
    text-align:center;
    padding:18px;
    font-size:11.5px;
    color:var(--text-low);
    border-top:1px solid var(--border);
    font-family:var(--mono);
  }

  ::-webkit-scrollbar{height:8px;width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="mark">FB</div>
    <div>
      <h1>Análise das Campanhas — Facebook Ads</h1>
      <span class="sub">Conversas, custo por conversa e investimento por cliente</span>
    </div>
  </div>
  <div class="refresh-row">
    <span class="last-sync" id="lastSync">aguardando dados…</span>
    <button class="btn-refresh" id="refreshBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg>
      Atualizar dados
    </button>
  </div>
</div>

<div class="tabs-wrap">
  <div class="tabs" id="clientTabs">
    <button class="tab-btn active" data-client="JMS LANTERNAGEM"><span class="dot"></span>JMS Lanternagem</button>
    <button class="tab-btn" data-client="REVISACAR"><span class="dot"></span>RevisaCar</button>
  </div>
</div>

<main id="panelsRoot"></main>

<footer>Fonte dos dados: Google Sheets · atualização automática a cada carregamento da página</footer>

<script>
/* =========================================================
   CONFIG
   ========================================================= */
const SHEET_ID = "1EcKbSEVZU7-zXSl4RoGXcSCETQa_DK3rPyoeFpPe3X8";
const CLIENTS = [
  { key: "JMS LANTERNAGEM", label: "JMS Lanternagem", sheetName: "JMS LANTERNAGEM", accent: "#2e8fff" },
  { key: "REVISACAR",       label: "RevisaCar",       sheetName: "REVISACAR",       accent: "#22d3c5" }
];

function gvizUrl(sheetName){
  return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}&cb=${Date.now()}`;
}

/* =========================================================
   PANEL HTML BUILDER (per client)
   ========================================================= */
function buildPanelHTML(client){
  return `
  <section class="client-panel" id="panel-${cssId(client.key)}" data-client="${client.key}">

    <div class="section-label first">Filtro de período</div>
    <div class="filterbar">
      <div class="field">
        <label>De</label>
        <input type="date" class="date-start">
      </div>
      <div class="field">
        <label>Até</label>
        <input type="date" class="date-end">
      </div>
      <div class="presets">
        <button class="chip" data-range="7">7 dias</button>
        <button class="chip" data-range="14">14 dias</button>
        <button class="chip" data-range="30">30 dias</button>
        <button class="chip" data-range="all">Tudo</button>
      </div>
      <div class="filter-status"></div>
    </div>

    <div class="section-label">Visão geral do período</div>
    <div class="kpi-grid">
      <div class="kpi-card" style="--accent:${client.accent}">
        <div class="kpi-label">Conversas no período</div>
        <div class="kpi-value kpi-total-conv">—</div>
      </div>
      <div class="kpi-card" style="--accent:${client.accent}">
        <div class="kpi-label">Média de conversas / dia</div>
        <div class="kpi-value kpi-avg-conv">—</div>
      </div>
      <div class="kpi-card" style="--accent:#f5a623">
        <div class="kpi-label">Custo médio por conversa</div>
        <div class="kpi-value kpi-cpc"><sup>R$</sup><span></span></div>
      </div>
      <div class="kpi-card" style="--accent:#ff5d6c">
        <div class="kpi-label">Total investido</div>
        <div class="kpi-value kpi-total-gasto"><sup>R$</sup><span></span></div>
      </div>
    </div>

    <div class="section-label">Análise diária</div>
    <div class="chart-panel">
      <div class="legend-row">
        <div class="item"><span class="swatch" style="background:${client.accent}"></span>Nº de conversas</div>
        <div class="item"><span class="swatch line" style="background:#fff"></span>Custo por conversa</div>
        <div class="item"><span class="swatch line" style="background:#ff5d6c"></span>Total gasto</div>
      </div>
      <div class="chart-canvas-wrap">
        <canvas class="chart-canvas"></canvas>
      </div>
      <div class="state-msg">
        <div class="spinner"></div>
        <div class="state-text">Carregando dados da planilha…</div>
      </div>
    </div>

  </section>`;
}

function cssId(str){ return str.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

/* =========================================================
   CSV PARSER (handles quoted fields, gviz csv output)
   ========================================================= */
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\n' || c === '\r'){
        if(c === '\r' && text[i+1] === '\n') i++;
        row.push(field); field='';
        rows.push(row); row=[];
      } else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(cell => cell !== ''));
}

/* Converte número em formato BR ("1.234,56" ou "12,5") para float */
function parseBRNumber(str){
  if(str === undefined || str === null) return NaN;
  str = String(str).trim();
  if(str === '') return NaN;
  str = str.replace(/[^\d,.\-]/g,'');
  if(str.indexOf(',') > -1){
    str = str.replace(/\./g,'').replace(',', '.');
  }
  return parseFloat(str);
}

/* Converte "16/06/2026" -> Date e também retorna chave ISO "2026-06-16" */
function parseBRDate(str){
  const m = String(str).trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(!m) return null;
  const d = parseInt(m[1],10), mo = parseInt(m[2],10), y = parseInt(m[3],10);
  const dt = new Date(y, mo-1, d);
  const iso = `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  return { date: dt, iso };
}

function fmtDateLabel(dt){
  return dt.toLocaleDateString('pt-BR', { day:'2-digit', month:'short' }).replace('.','');
}

function fmtBRL(n){
  if(!isFinite(n)) return '0,00';
  return n.toLocaleString('pt-BR', { minimumFractionDigits:2, maximumFractionDigits:2 });
}

/* =========================================================
   STATE
   ========================================================= */
const STATE = {}; // keyed by client.key -> { rows: [...], chart: Chart instance, els: {...} }

/* =========================================================
   INIT PANELS
   ========================================================= */
const root = document.getElementById('panelsRoot');
CLIENTS.forEach((client, idx) => {
  root.insertAdjacentHTML('beforeend', buildPanelHTML(client));
  const panel = document.getElementById(`panel-${cssId(client.key)}`);
  if(idx === 0) panel.classList.add('active');

  const els = {
    panel,
    dateStart: panel.querySelector('.date-start'),
    dateEnd: panel.querySelector('.date-end'),
    chips: panel.querySelectorAll('.chip'),
    status: panel.querySelector('.filter-status'),
    kpiTotalConv: panel.querySelector('.kpi-total-conv'),
    kpiAvgConv: panel.querySelector('.kpi-avg-conv'),
    kpiCpc: panel.querySelector('.kpi-cpc span'),
    kpiTotalGasto: panel.querySelector('.kpi-total-gasto span'),
    canvas: panel.querySelector('.chart-canvas'),
    stateMsg: panel.querySelector('.state-msg'),
    stateText: panel.querySelector('.state-text'),
    chartWrap: panel.querySelector('.chart-canvas-wrap')
  };

  STATE[client.key] = { client, rows: [], chart: null, els, activePreset: 'all' };

  // date filter listeners
  els.dateStart.addEventListener('change', () => { setActiveChip(client.key, null); applyFilter(client.key); });
  els.dateEnd.addEventListener('change', () => { setActiveChip(client.key, null); applyFilter(client.key); });

  els.chips.forEach(chip => {
    chip.addEventListener('click', () => {
      setActiveChip(client.key, chip);
      applyPreset(client.key, chip.dataset.range);
    });
  });
});

/* tab switching */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const key = btn.dataset.client;
    document.querySelectorAll('.client-panel').forEach(p => {
      p.classList.toggle('active', p.dataset.client === key);
    });
    // resize chart on tab show (Chart.js needs visible canvas to size correctly)
    const st = STATE[key];
    if(st && st.chart) st.chart.resize();
  });
});

document.getElementById('refreshBtn').addEventListener('click', () => loadAll(true));

/* =========================================================
   LOAD DATA
   ========================================================= */
async function loadAll(isManual){
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  await Promise.all(CLIENTS.map(c => loadClient(c)));
  btn.classList.remove('spinning');
  document.getElementById('lastSync').textContent =
    'última atualização: ' + new Date().toLocaleString('pt-BR', { hour:'2-digit', minute:'2-digit', day:'2-digit', month:'2-digit', year:'numeric' });
}

async function loadClient(client){
  const st = STATE[client.key];
  const { els } = st;
  els.stateMsg.classList.add('show');
  els.stateText.textContent = 'Carregando dados da planilha…';
  els.chartWrap.style.display = 'none';

  try{
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 10000); // 10s timeout

    let res;
    try{
      res = await fetch(gvizUrl(client.sheetName), { signal: controller.signal, cache: 'no-store' });
    } catch(networkErr){
      clearTimeout(timeoutId);
      if(networkErr.name === 'AbortError') throw new Error('timeout');
      throw new Error('network');
    }
    clearTimeout(timeoutId);

    if(!res.ok){
      if(res.status === 400 || res.status === 404) throw new Error('sheet-not-found');
      throw new Error('http-' + res.status);
    }
    const text = await res.text();

    if(/<html/i.test(text.slice(0,200)) || /accounts\.google\.com/i.test(text.slice(0,300))){
      throw new Error('not-public');
    }

    const table = parseCSV(text);
    if(table.length < 2) throw new Error('empty');

    const header = table[0].map(h => h.trim().toLowerCase());
    const idxDia   = header.findIndex(h => h.includes('dia'));
    const idxConv  = header.findIndex(h => h.includes('conversa') && !h.includes('custo'));
    const idxCusto = header.findIndex(h => h.includes('custo'));
    const idxGasto = header.findIndex(h => h.includes('gasto'));

    if(idxDia === -1 || idxConv === -1) throw new Error('bad-header');

    const rows = [];
    for(let i=1;i<table.length;i++){
      const r = table[i];
      const dRaw = r[idxDia];
      const parsed = parseBRDate(dRaw);
      if(!parsed) continue;
      const conv = parseBRNumber(r[idxConv]) || 0;
      const custo = idxCusto > -1 ? parseBRNumber(r[idxCusto]) : NaN;
      const gasto = idxGasto > -1 ? parseBRNumber(r[idxGasto]) : NaN;
      rows.push({
        date: parsed.date,
        iso: parsed.iso,
        label: fmtDateLabel(parsed.date),
        conversas: conv,
        custoPorConversa: isFinite(custo) ? custo : (conv > 0 ? gasto / conv : 0),
        totalGasto: isFinite(gasto) ? gasto : (custo * conv)
      });
    }
    rows.sort((a,b) => a.date - b.date);

    if(!rows.length) throw new Error('no-rows');

    st.rows = rows;
    els.stateMsg.classList.remove('show');
    els.chartWrap.style.display = 'block';

    // set date inputs bounds + default to full range
    const minISO = rows[0].iso, maxISO = rows[rows.length-1].iso;
    els.dateStart.min = minISO; els.dateStart.max = maxISO;
    els.dateEnd.min = minISO; els.dateEnd.max = maxISO;
    if(!els.dateStart.value) els.dateStart.value = minISO;
    if(!els.dateEnd.value) els.dateEnd.value = maxISO;

    applyFilter(client.key);

  } catch(err){
    els.chartWrap.style.display = 'none';
    els.stateMsg.classList.add('show');
    if(err.message === 'not-public'){
      els.stateText.innerHTML = `Não consegui ler a aba <code>${client.sheetName}</code>. A planilha provavelmente está com acesso restrito. No Google Sheets, clique em <strong>Compartilhar</strong> → <strong>Acesso geral</strong> → selecione <strong>"Qualquer pessoa com o link"</strong> (papel: Leitor) e clique em <a href="javascript:void(0)" onclick="loadAll()">Tentar de novo</a>.`;
    } else if(err.message === 'sheet-not-found'){
      els.stateText.innerHTML = `Não encontrei uma aba chamada exatamente <code>${client.sheetName}</code> na planilha. Confira se o nome da aba está escrito assim, sem espaços extras. <a href="javascript:void(0)" onclick="loadAll()">Tentar de novo</a>`;
    } else if(err.message === 'network'){
      els.stateText.innerHTML = `Falha de rede/CORS ao acessar o Google Sheets. Confira sua conexão ou se a planilha está pública, e clique em <a href="javascript:void(0)" onclick="loadAll()">Tentar de novo</a>.`;
    } else if(err.message === 'timeout'){
      els.stateText.innerHTML = `O Google Sheets demorou demais para responder. <a href="javascript:void(0)" onclick="loadAll()">Tentar de novo</a>`;
    } else if(err.message === 'bad-header'){
      els.stateText.innerHTML = `A aba <code>${client.sheetName}</code> foi encontrada, mas as colunas esperadas (Dia, Nº de Conversas, Custo por Conversa, Total gasto) não foram identificadas. Confira o cabeçalho da primeira linha.`;
    } else if(err.message === 'no-rows' || err.message === 'empty'){
      els.stateText.innerHTML = `A aba <code>${client.sheetName}</code> foi encontrada, mas não há linhas com datas válidas (formato esperado: DD/MM/AAAA).`;
    } else {
      els.stateText.innerHTML = `Não foi possível carregar os dados da aba <code>${client.sheetName}</code> agora (${err.message}). <a href="javascript:void(0)" onclick="loadAll()">Tentar novamente</a>`;
    }
  }
}

/* =========================================================
   FILTER LOGIC
   ========================================================= */
function setActiveChip(key, chipEl){
  const { els } = STATE[key];
  els.chips.forEach(c => c.classList.remove('active'));
  if(chipEl) chipEl.classList.add('active');
}

function applyPreset(key, range){
  const st = STATE[key];
  if(!st.rows.length) return;
  const { els, rows } = st;
  const maxDate = rows[rows.length-1].date;
  let startDate;
  if(range === 'all'){
    startDate = rows[0].date;
  } else {
    const n = parseInt(range,10);
    startDate = new Date(maxDate);
    startDate.setDate(startDate.getDate() - (n-1));
  }
  const toISO = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  els.dateStart.value = toISO(startDate < rows[0].date ? rows[0].date : startDate);
  els.dateEnd.value = toISO(maxDate);
  applyFilter(key);
}

function applyFilter(key){
  const st = STATE[key];
  const { els, rows } = st;
  if(!rows.length) return;

  const startVal = els.dateStart.value;
  const endVal = els.dateEnd.value;
  let filtered = rows;

  if(startVal && endVal){
    filtered = rows.filter(r => r.iso >= startVal && r.iso <= endVal);
  }

  if(!filtered.length){
    els.status.textContent = 'Nenhum dado no período selecionado';
  } else {
    els.status.textContent = `${filtered.length} dia(s) no período`;
  }

  renderKPIs(st, filtered);
  renderChart(st, filtered);
}

/* =========================================================
   RENDER KPIs
   ========================================================= */
function renderKPIs(st, data){
  const { els } = st;
  const totalConv = data.reduce((s,r) => s + r.conversas, 0);
  const totalGasto = data.reduce((s,r) => s + r.totalGasto, 0);
  const avgConv = data.length ? totalConv / data.length : 0;
  const cpc = totalConv > 0 ? totalGasto / totalConv : 0;

  els.kpiTotalConv.textContent = totalConv.toLocaleString('pt-BR');
  els.kpiAvgConv.textContent = avgConv.toLocaleString('pt-BR', { maximumFractionDigits: 1 });
  els.kpiCpc.textContent = fmtBRL(cpc);
  els.kpiTotalGasto.textContent = fmtBRL(totalGasto);
}

/* =========================================================
   RENDER CHART
   ========================================================= */
function renderChart(st, data){
  if (typeof Chart === 'undefined') {
    // Chart.js ainda não carregou (CDN lento/bloqueado) — tenta de novo em breve
    if (!st._chartRetries) st._chartRetries = 0;
    if (st._chartRetries < 20) {
      st._chartRetries++;
      st.els.stateMsg.classList.add('show');
      st.els.stateText.textContent = 'Carregando biblioteca de gráficos…';
      st.els.chartWrap.style.display = 'none';
      setTimeout(() => renderChart(st, data), 300);
    } else {
      st.els.stateMsg.classList.add('show');
      st.els.stateText.innerHTML = 'Não foi possível carregar a biblioteca de gráficos (Chart.js). Verifique sua conexão ou se algum bloqueador de conteúdo está impedindo o carregamento de scripts externos, e <a href="javascript:void(0)" onclick="location.reload()">recarregue a página</a>.';
      st.els.chartWrap.style.display = 'none';
    }
    return;
  }

  const { els, client } = st;
  const labels = data.map(r => r.label);
  const conversas = data.map(r => r.conversas);
  const custo = data.map(r => r.custoPorConversa);
  const gasto = data.map(r => r.totalGasto);

  els.stateMsg.classList.remove('show');
  els.chartWrap.style.display = 'block';

  const ctx = els.canvas.getContext('2d');

  const gridColor = '#222938';
  const tickColor = '#9aa4b8';

  if(st.chart){ st.chart.destroy(); }

  st.chart = new Chart(ctx, {
    data: {
      labels,
      datasets: [
        {
          type: 'bar',
          label: 'Nº de conversas',
          data: conversas,
          backgroundColor: client.accent,
          borderRadius: 5,
          maxBarThickness: 46,
          yAxisID: 'yBars',
          order: 2
        },
        {
          type: 'line',
          label: 'Custo por conversa (R$)',
          data: custo,
          borderColor: '#ffffff',
          backgroundColor: '#ffffff',
          pointRadius: 3,
          pointBackgroundColor: '#ffffff',
          borderWidth: 2,
          tension: 0.35,
          yAxisID: 'yLineCusto',
          order: 0
        },
        {
          type: 'line',
          label: 'Total gasto (R$)',
          data: gasto,
          borderColor: '#ff5d6c',
          backgroundColor: '#ff5d6c',
          pointRadius: 3,
          pointBackgroundColor: '#ff5d6c',
          borderWidth: 2,
          tension: 0.35,
          yAxisID: 'yLineGasto',
          order: 1
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1a2030',
          borderColor: '#2c3548',
          borderWidth: 1,
          titleColor: '#f3f5f9',
          bodyColor: '#cbd2e0',
          padding: 10,
          callbacks: {
            label: (ctx) => {
              const dsLabel = ctx.dataset.label;
              if(dsLabel.includes('R$')) return `${dsLabel}: R$ ${fmtBRL(ctx.parsed.y)}`;
              return `${dsLabel}: ${ctx.parsed.y}`;
            }
          }
        }
      },
      scales: {
        x: {
          grid: { color: gridColor, drawTicks:false },
          ticks: { color: tickColor, font:{ size:11 } }
        },
        yBars: {
          position: 'left',
          grid: { color: gridColor },
          ticks: { color: tickColor, font:{ size:11 }, precision:0 },
          title: { display:true, text:'Nº de conversas', color: tickColor, font:{ size:11 } }
        },
        yLineCusto: {
          position: 'right',
          grid: { display:false },
          ticks: { color: tickColor, font:{ size:10 } },
          title: { display:false }
        },
        yLineGasto: {
          position: 'right',
          display: false,
          grid: { display:false }
        }
      }
    }
  });
}

/* =========================================================
   GO
   ========================================================= */
loadAll();
</script>
