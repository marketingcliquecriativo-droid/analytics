<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VidaCard | Calendário de Conteúdos 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --teal-900:#063f38;
    --teal-800:#0a6e63;
    --teal-700:#0f8f7e;
    --teal-600:#14a897;
    --teal-500:#1abda9;
    --lime:#c7db2e;
    --lime-dark:#9db514;
    --orange-1:#f9a01b;
    --orange-2:#ef7f1a;
    --white:#ffffff;
    --ink:#0a3a33;
    --ink-soft:#3d6b63;
    --card-line:rgba(199,219,46,0.55);
    --shadow: 0 18px 40px -18px rgba(4,40,35,0.55);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Nunito',sans-serif;
    background:
      radial-gradient(1200px 700px at 15% -10%, rgba(255,255,255,0.10), transparent 60%),
      linear-gradient(160deg, var(--teal-600) 0%, var(--teal-800) 55%, var(--teal-900) 100%);
    background-attachment: fixed;
    color:var(--white);
    min-height:100vh;
    padding: 32px 18px 80px;
  }

  .wrap{max-width:1080px;margin:0 auto;}

  /* HEADER */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:18px;
    margin-bottom:34px;
  }
  .brand{display:flex;align-items:center;gap:14px;}
  .brand svg{width:52px;height:52px;flex-shrink:0;}
  .brand-text .name{
    font-family:'Poppins',sans-serif;
    font-weight:800;
    font-size:1.55rem;
    letter-spacing:0.5px;
    line-height:1;
  }
  .brand-text .name span{color:var(--lime);}
  .brand-text .tag{
    font-size:0.82rem;
    font-weight:600;
    color:rgba(255,255,255,0.85);
    margin-top:3px;
  }

  .header-title{text-align:right;}
  .header-title h1{
    font-family:'Poppins',sans-serif;
    font-size:1.35rem;
    font-weight:700;
    margin:0 0 2px;
  }
  .header-title p{
    margin:0;
    font-size:0.88rem;
    color:rgba(255,255,255,0.75);
    font-weight:600;
  }

  /* LEGEND */
  .legend{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:26px;
  }
  .legend-item{
    display:flex;
    align-items:center;
    gap:8px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.16);
    padding:8px 14px;
    border-radius:999px;
    font-size:0.82rem;
    font-weight:700;
  }
  .dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;}
  .dot.franquia{background:var(--lime);box-shadow:0 0 0 3px rgba(199,219,46,0.25);}
  .dot.unidade{background:var(--orange-1);box-shadow:0 0 0 3px rgba(249,160,27,0.28);}

  /* TABS */
  .tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:6px;
    margin-bottom:20px;
    scrollbar-width:thin;
  }
  .tabs::-webkit-scrollbar{height:5px;}
  .tabs::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.3);border-radius:10px;}

  .tab-btn{
    font-family:'Poppins',sans-serif;
    font-weight:700;
    font-size:0.85rem;
    color:var(--white);
    background:rgba(255,255,255,0.10);
    border:1px solid rgba(255,255,255,0.18);
    padding:10px 18px;
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
    transition:all 0.18s ease;
  }
  .tab-btn:hover{background:rgba(255,255,255,0.18);}
  .tab-btn.active{
    background:linear-gradient(135deg, var(--lime), var(--lime-dark));
    color:var(--ink);
    border-color:transparent;
  }

  /* CALENDAR CARD */
  .month-panel{display:none;}
  .month-panel.active{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);}}

  .calendar-card{
    background:var(--white);
    border-radius:22px;
    padding:26px 26px 22px;
    box-shadow:var(--shadow);
    color:var(--ink);
    position:relative;
    overflow:hidden;
  }
  .calendar-card::before{
    content:"";
    position:absolute;
    top:0;left:0;right:0;
    height:6px;
    background:linear-gradient(90deg, var(--lime), var(--teal-600), var(--orange-1));
  }

  .month-heading{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:16px;
    flex-wrap:wrap;
    gap:8px;
  }
  .month-heading h2{
    font-family:'Poppins',sans-serif;
    font-size:1.4rem;
    font-weight:800;
    margin:0;
    color:var(--teal-800);
  }
  .month-heading .pending-flag{
    font-size:0.75rem;
    font-weight:800;
    color:var(--orange-2);
    background:rgba(249,160,27,0.14);
    border:1px solid rgba(239,127,26,0.35);
    padding:5px 12px;
    border-radius:999px;
  }

  .weekdays{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
    margin-bottom:8px;
  }
  .weekdays span{
    text-align:center;
    font-size:0.72rem;
    font-weight:800;
    letter-spacing:0.4px;
    color:var(--ink-soft);
    text-transform:uppercase;
  }

  .days-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
  }

  .day-cell{
    position:relative;
    min-height:74px;
    border-radius:12px;
    background:#f4faf8;
    border:1px solid #e4efec;
    padding:6px 6px 8px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    transition:transform 0.12s ease, box-shadow 0.12s ease;
  }
  .day-cell.empty{background:transparent;border:none;}
  .day-cell .num{
    font-family:'Poppins',sans-serif;
    font-weight:700;
    font-size:0.82rem;
    color:var(--ink);
    align-self:flex-start;
  }
  .day-cell.has-event{cursor:pointer;}
  .day-cell.has-event:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 18px -8px rgba(10,58,51,0.35);
  }
  .day-cell.franquia{
    background:linear-gradient(160deg,#f2f8d9,#eef6c9);
    border-color:rgba(157,181,20,0.4);
  }
  .day-cell.unidade{
    background:linear-gradient(160deg,#fff1dc,#ffe6bf);
    border-color:rgba(239,127,26,0.4);
  }
  .day-cell.franquia .num{color:var(--lime-dark);}
  .day-cell.unidade .num{color:var(--orange-2);}

  .dots-row{display:flex;gap:4px;flex-wrap:wrap;}
  .mini-dot{width:7px;height:7px;border-radius:50%;}
  .mini-dot.franquia{background:var(--lime-dark);}
  .mini-dot.unidade{background:var(--orange-2);}

  .event-label{
    font-size:0.62rem;
    font-weight:700;
    color:var(--ink-soft);
    line-height:1.1;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  .month-note{
    margin-top:16px;
    font-size:0.82rem;
    color:var(--ink-soft);
    font-weight:600;
    background:#f4faf8;
    border:1px dashed #cfe3dd;
    border-radius:12px;
    padding:12px 14px;
  }

  /* MODAL */
  .overlay{
    position:fixed;inset:0;
    background:rgba(6,42,37,0.55);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:50;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--white);
    color:var(--ink);
    max-width:420px;
    width:100%;
    border-radius:20px;
    padding:24px 24px 20px;
    box-shadow:var(--shadow);
    position:relative;
  }
  .modal-close{
    position:absolute;
    top:14px;right:16px;
    background:none;
    border:none;
    font-size:1.2rem;
    cursor:pointer;
    color:var(--ink-soft);
    line-height:1;
  }
  .modal h3{
    font-family:'Poppins',sans-serif;
    font-size:1.1rem;
    margin:0 0 14px;
    color:var(--teal-800);
    padding-right:20px;
  }
  .modal-event{
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:10px;
    border:1px solid #e4efec;
  }
  .modal-event.franquia{background:#f2f8d9;border-color:rgba(157,181,20,0.35);}
  .modal-event.unidade{background:#fff1dc;border-color:rgba(239,127,26,0.35);}
  .modal-event .unit{
    font-size:0.68rem;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:0.4px;
    margin-bottom:4px;
    display:inline-block;
    padding:2px 8px;
    border-radius:999px;
  }
  .modal-event.franquia .unit{background:var(--lime-dark);color:#fff;}
  .modal-event.unidade .unit{background:var(--orange-2);color:#fff;}
  .modal-event .type{
    font-size:0.72rem;
    font-weight:700;
    color:var(--ink-soft);
    margin-bottom:2px;
  }
  .modal-event .title{font-size:0.92rem;font-weight:700;}

  footer{
    text-align:center;
    margin-top:34px;
    font-size:0.78rem;
    color:rgba(255,255,255,0.6);
    font-weight:600;
  }

  @media (max-width:560px){
    .header-title{text-align:left;}
    header{flex-direction:column;align-items:flex-start;}
    .day-cell{min-height:60px;padding:5px 4px 6px;}
    .event-label{display:none;}
    .calendar-card{padding:20px 14px 18px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 82 C20 62, 6 45, 6 28 C6 14, 17 4, 30 4 C39 4, 46 9, 50 16 C50 16 50 16 50 16"
              stroke="#ffffff" stroke-width="9" stroke-linecap="round" fill="none"/>
        <path d="M50 82 C80 62, 94 45, 94 28 C94 14, 83 4, 70 4 C61 4, 54 9, 50 16"
              stroke="var(--lime, #c7db2e)" stroke-width="9" stroke-linecap="round" fill="none"/>
        <rect x="43" y="24" width="14" height="34" rx="4" fill="#ffffff"/>
        <rect x="33" y="34" width="34" height="14" rx="4" fill="#ffffff"/>
      </svg>
      <div class="brand-text">
        <div class="name">VIDA<span>CARD</span></div>
        <div class="tag">Cartão de Saúde</div>
      </div>
    </div>
    <div class="header-title">
      <h1>Calendário de Conteúdos 2026</h1>
      <p>Franquia · Santa Rosa &amp; Giruá</p>
    </div>
  </header>

  <div class="legend">
    <div class="legend-item"><span class="dot franquia"></span> Conteúdo padrão da franquia (Santa Rosa e Giruá)</div>
    <div class="legend-item"><span class="dot unidade"></span> Conteúdo exclusivo por unidade</div>
  </div>

  <div class="tabs" id="tabs"></div>

  <div id="panels"></div>

  <footer>VidaCard · Planejamento de conteúdo · Atualizado em julho/2026</footer>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <button class="modal-close" id="modalClose">✕</button>
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
  </div>
</div>

<script>
const WEEKDAYS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

// startDow = weekday index (0=Sunday) of day 1 of the month, in 2026
const MONTHS = [
  {
    key:'jul', label:'Julho', full:'Julho de 2026', startDow:3, days:31,
    events:{
      2:[{unit:'Ambas as unidades', badge:'franquia', type:'Publicação da franquia', title:'Reels…'}],
      3:[{unit:'Ambas as unidades', badge:'franquia', type:'Publicação da franquia', title:'A gente…'}],
      4:[
        {unit:'VidaCard Santa Rosa', badge:'unidade', type:'Carrossel', title:'Qual o momento certo para procurar um Ginecologista?'},
        {unit:'VidaCard Giruá', badge:'unidade', type:'Vídeo', title:'Dor de cabeça, sinais de alerta'}
      ],
      5:[{unit:'Ambas as unidades', badge:'franquia', type:'Publicação da franquia', title:'Consultas'}],
      6:[
        {unit:'VidaCard Santa Rosa', badge:'unidade', type:'Post único', title:'Dê um zoom…'},
        {unit:'VidaCard Giruá', badge:'unidade', type:'Vídeo', title:'Sua escovação pode estar incompleta'}
      ],
      7:[{unit:'Ambas as unidades', badge:'franquia', type:'Publicação da franquia', title:'Reels…'}],
      9:[{unit:'Ambas as unidades', badge:'franquia', type:'Publicação da franquia', title:'Reels…'}],
      11:[{unit:'Ambas as unidades', badge:'franquia', type:'Publicação da franquia', title:'Exames'}],
      14:[{unit:'Ambas as unidades', badge:'franquia', type:'Publicação da franquia', title:'Reels…'}],
      16:[{unit:'Ambas as unidades', badge:'franquia', type:'Publicação da franquia', title:'Reels…'}],
      18:[{unit:'Ambas as unidades', badge:'franquia', type:'Publicação da franquia', title:'Julho…'}],
      21:[{unit:'Ambas as unidades', badge:'franquia', type:'Publicação da franquia', title:'Reels…'}],
      25:[{unit:'Ambas as unidades', badge:'franquia', type:'Publicação da franquia', title:'Conteúdo do dia'}],
      26:[
        {unit:'Ambas as unidades', badge:'franquia', type:'Publicação da franquia', title:'Avós'},
        {unit:'Ambas as unidades', badge:'franquia', type:'Publicação da franquia', title:'Dia da Avó'}
      ],
      27:[{unit:'Ambas as unidades', badge:'franquia', type:'Publicação da franquia', title:'Cabeça e…'}],
      28:[
        {unit:'Ambas as unidades', badge:'franquia', type:'Publicação da franquia', title:'Hepatite'},
        {unit:'Ambas as unidades', badge:'franquia', type:'Publicação da franquia', title:'Julho…'},
        {unit:'Ambas as unidades', badge:'franquia', type:'Publicação da franquia', title:'Reels…'},
        {unit:'Ambas as unidades', badge:'franquia', type:'Publicação da franquia', title:'Story…'}
      ],
      29:[{unit:'Ambas as unidades', badge:'franquia', type:'Publicação da franquia', title:'App…'}],
      30:[{unit:'Ambas as unidades', badge:'franquia', type:'Publicação da franquia', title:'Reels…'}]
    }
  },
  { key:'ago', label:'Agosto', full:'Agosto de 2026', startDow:6, days:31, events:{} },
  { key:'set', label:'Setembro', full:'Setembro de 2026', startDow:2, days:30, events:{} },
  { key:'out', label:'Outubro', full:'Outubro de 2026', startDow:4, days:31, events:{} },
  { key:'nov', label:'Novembro', full:'Novembro de 2026', startDow:0, days:30, events:{} },
  { key:'dez', label:'Dezembro', full:'Dezembro de 2026', startDow:2, days:31, events:{} }
];

function cellClass(events){
  if(!events || events.length===0) return '';
  const hasUnidade = events.some(e=>e.badge==='unidade');
  const hasFranquia = events.some(e=>e.badge==='franquia');
  if(hasUnidade && !hasFranquia) return 'unidade';
  return 'franquia'; // franquia takes visual priority when mixed, unidade posts still listed inside
}

function buildMonthHTML(month, idx){
  let daysHTML = '';
  for(let i=0;i<month.startDow;i++){
    daysHTML += `<div class="day-cell empty"></div>`;
  }
  for(let d=1; d<=month.days; d++){
    const ev = month.events[d];
    const cls = cellClass(ev);
    const hasEvent = ev && ev.length>0;
    const dotsHTML = hasEvent ? `<div class="dots-row">${ev.map(e=>`<span class="mini-dot ${e.badge}"></span>`).join('')}</div>` : '';
    const labelHTML = hasEvent ? `<div class="event-label">${ev[0].title}${ev.length>1?` +${ev.length-1}`:''}</div>` : '';
    daysHTML += `<div class="day-cell ${hasEvent?'has-event '+cls:''}" ${hasEvent?`data-month="${idx}" data-day="${d}"`:''}>
        <span class="num">${d}</span>
        ${labelHTML}
        ${dotsHTML}
      </div>`;
  }

  const isPending = Object.keys(month.events).length === 0;

  return `
    <div class="calendar-card">
      <div class="month-heading">
        <h2>${month.full}</h2>
        ${isPending ? `<span class="pending-flag">Datas em definição</span>` : ''}
      </div>
      <div class="weekdays">${WEEKDAYS.map(w=>`<span>${w}</span>`).join('')}</div>
      <div class="days-grid">${daysHTML}</div>
      ${isPending ? `<div class="month-note">Os dias de postagem da franquia para este mês ainda não foram definidos. Assim que o planejamento chegar, este calendário pode ser atualizado com os mesmos destaques usados em julho.</div>` : ''}
    </div>
  `;
}

const tabsEl = document.getElementById('tabs');
const panelsEl = document.getElementById('panels');

MONTHS.forEach((m, idx)=>{
  const btn = document.createElement('button');
  btn.className = 'tab-btn' + (idx===0 ? ' active' : '');
  btn.textContent = m.label;
  btn.dataset.idx = idx;
  btn.addEventListener('click', ()=>selectMonth(idx));
  tabsEl.appendChild(btn);

  const panel = document.createElement('div');
  panel.className = 'month-panel' + (idx===0 ? ' active' : '');
  panel.dataset.idx = idx;
  panel.innerHTML = buildMonthHTML(m, idx);
  panelsEl.appendChild(panel);
});

function selectMonth(idx){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', +b.dataset.idx===idx));
  document.querySelectorAll('.month-panel').forEach(p=>p.classList.toggle('active', +p.dataset.idx===idx));
}

// Modal handling
const overlay = document.getElementById('overlay');
const modalTitle = document.getElementById('modalTitle');
const modalBody = document.getElementById('modalBody');

panelsEl.addEventListener('click', (e)=>{
  const cell = e.target.closest('.day-cell.has-event');
  if(!cell) return;
  const monthIdx = +cell.dataset.month;
  const day = +cell.dataset.day;
  const month = MONTHS[monthIdx];
  const events = month.events[day];

  modalTitle.textContent = `${day} de ${month.label}`;
  modalBody.innerHTML = events.map(ev => `
    <div class="modal-event ${ev.badge}">
      <span class="unit">${ev.unit}</span>
      <div class="type">${ev.type}</div>
      <div class="title">${ev.title}</div>
    </div>
  `).join('');
  overlay.classList.add('open');
});

document.getElementById('modalClose').addEventListener('click', ()=> overlay.classList.remove('open'));
overlay.addEventListener('click', (e)=>{ if(e.target === overlay) overlay.classList.remove('open'); });
document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') overlay.classList.remove('open'); });
</script>
</body>
</html>
