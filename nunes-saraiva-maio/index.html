<!DOCTYPE html><html lang='pt-BR'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Nunes Saraiva Advogados | 20 Conteúdos</title><style>body{margin:0;background:#050505;color:#e7d19a;font-family:Arial,sans-serif;line-height:1.6}.wrap{max-width:1100px;margin:auto;padding:30px}h1{font-size:54px;color:#fff}span.gold{color:#d4af5a}.card{background:#111;border:1px solid #8f7440;border-radius:20px;padding:20px;margin:16px 0}.fala{background:#241c12}.tag{display:inline-block;background:#d4af5a;color:#000;border-radius:999px;padding:7px 12px;font-weight:bold}</style></head><body><div class='wrap'><h1>20 temas com <span class='gold'>falas prontas</span></h1><p>Nunes Saraiva Advogados — Direito previdenciário e trabalhista. Conteúdos para redes sociais com começo, meio e fim.</p><div id='conteudos'></div></div><script>const temas=['Fibromialgia dá direito ao INSS?','O erro que faz perder benefício','Alzheimer na família','BPC não é aposentadoria','INSS negou. E agora?','Empresa pode demitir trabalhador doente?','Burnout, ansiedade e trabalho','Atestado médico','Auxílio-doença x aposentadoria','Afastamento pelo INSS e emprego','Você não é preguiçoso','Medo da perícia','Você parece bem','Quando a família acha exagero','Adoeceu e ainda precisa provar','Cuida de alguém com Alzheimer?','Trabalhador doente não é descartável','Medo de perder o emprego','Mande para quem teve INSS negado','Quem precisa de ajuda demora a procurar'];document.getElementById('conteudos').innerHTML=temas.map((t,i)=>`<div class='card'><h2>Tema ${String(i+1).padStart(2,'0')} — ${t}</h2><span class='tag'>${i<10?'Educativo':'Identificação'}</span><div class='card'><b>Conteúdo:</b> conteúdo estruturado para gerar atenção, conexão e compartilhamento nas redes sociais.</div><div class='card fala'><b>Fala:</b><br><br><b>Começo:</b> “${i%2===0?'Você sabia que muitas pessoas passam por isso e nem imaginam que podem ter direitos?':'Se você conhece alguém vivendo isso, manda esse vídeo agora.'}”<br><br><b>Meio:</b> “O ponto principal é entender que cada caso precisa ser analisado com documentos, histórico médico, relação com o trabalho e impacto real na rotina. Não basta olhar só para o nome da doença ou para uma negativa do INSS.”<br><br><b>Fim:</b> “Informação evita erro. Salve esse vídeo, compartilhe com quem precisa e procure orientação para avaliar o caso com cuidado.”</div></div>`).join('')</script></body></html>
