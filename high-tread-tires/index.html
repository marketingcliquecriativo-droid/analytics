<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>High Tread Tires - Estoque de Pneus</title>
  <style>
    :root{--bg:#050505;--panel:#101010;--panel2:#171717;--red:#ff3b30;--orange:#ff5a00;--text:#fff;--muted:#b8b8b8;--line:#2a2a2a;--ok:#35d07f;--low:#ff4d4d}*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;margin:0;background:radial-gradient(circle at 50% 0,#222 0,#111 38%,#050505 82%);color:var(--text);min-height:100vh}body:before{content:"";position:fixed;inset:auto 0 0 0;height:42vh;background:repeating-linear-gradient(12deg,rgba(255,255,255,.025) 0 12px,transparent 12px 42px),linear-gradient(180deg,transparent,#000);pointer-events:none}header{padding:34px 18px 26px;background:linear-gradient(180deg,#151515,#080808);border-bottom:1px solid #2b0000;position:relative;overflow:hidden}header:after{content:"";position:absolute;left:-10%;right:-10%;bottom:-26px;height:58px;background:linear-gradient(90deg,transparent,#5a0000,transparent);filter:blur(18px);opacity:.75}.brand{max-width:1160px;margin:0 auto;display:flex;gap:18px;align-items:center}.logoMark{width:78px;height:78px;border-radius:18px;background:#070707;display:grid;place-items:center;border:1px solid #222;box-shadow:0 0 24px rgba(255,59,48,.16)}.logoText{font-weight:900;font-style:italic;letter-spacing:-2px;font-size:21px;line-height:.9}.logoText span{display:block;font-size:11px;letter-spacing:1px}.flame{color:var(--red)}h1{margin:0;font-size:34px;letter-spacing:.5px;text-transform:uppercase}header p{margin:6px 0 0;color:var(--muted);font-size:15px}.badge{display:inline-block;background:var(--orange);color:#fff;padding:2px 8px;border-radius:4px;font-weight:800}main{max-width:1160px;margin:28px auto;padding:0 16px 50px;position:relative}.card{background:linear-gradient(180deg,rgba(23,23,23,.96),rgba(8,8,8,.96));border:1px solid var(--line);border-radius:26px;box-shadow:0 18px 50px rgba(0,0,0,.45);padding:22px;overflow:hidden}.top{display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between}.top h2{margin:0;text-transform:uppercase;letter-spacing:.08em}.tools{display:flex;gap:10px;flex-wrap:wrap}input{padding:14px 16px;border:1px solid #333;border-radius:14px;min-width:300px;background:#0b0b0b;color:#fff;outline:none}input:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(255,59,48,.18)}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.stat{background:#0d0d0d;border:1px solid #262626;padding:13px 16px;border-radius:16px;font-weight:800}.stat span{color:var(--red)}table{width:100%;border-collapse:separate;border-spacing:0;margin-top:12px;overflow:hidden;border-radius:16px}th,td{padding:13px;border-bottom:1px solid #242424;text-align:left}th{background:#0b0b0b;color:#e8e8e8;font-size:12px;text-transform:uppercase;letter-spacing:.08em}td{color:#f1f1f1}.low{color:var(--low);font-weight:900}.ok{color:var(--ok);font-weight:900}.price{font-weight:900;color:#fff}.msg{padding:14px;background:#1d120b;border:1px solid #7a2a00;border-radius:14px;margin:16px 0;color:#ffd9c2}a{color:#ff725c}.footerNote{margin-top:14px;color:#999;font-size:13px}@media(max-width:760px){.brand{align-items:flex-start}.logoMark{width:62px;height:62px}.logoText{font-size:17px}h1{font-size:24px}table{font-size:13px;display:block;overflow-x:auto;white-space:nowrap}th,td{padding:10px}input{min-width:100%;width:100%}.tools{width:100%}}
  </style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logoMark"><div class="logoText"><span class="flame">◢</span>HIGH<span>TREAD TIRES</span></div></div>
    <div><h1>High Tread Tires</h1><p>Finance your <span class="badge">tire purchase</span> and keep your business running smoothly.</p></div>
  </div>
</header>
<main>
  <div class="card">
    <div class="top">
      <h2>Inventário</h2>
      <div class="tools"><input id="search" placeholder="Buscar por nome, medida, SKU..." /></div>
    </div>
    <div id="message" class="msg">Carregando estoque da planilha online...</div>
    <div class="stats">
      <div class="stat">Itens: <span id="count">0</span></div>
      <div class="stat">Quantidade total: <span id="qty">0</span></div>
    </div>
    <table>
      <thead><tr><th>Nome</th><th>Medida</th><th>Qtd</th><th>Categoria</th><th>SKU</th><th>Preço</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="footerNote">Dados sincronizados com a planilha online Google Sheets.</div>
  </div>
</main>
<script>
const SHEET_ID='1n3_oc06VChLdSjTeAlYGhO5hZYwzK007NsWbKC_0T-g';
const CSV_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Sheet1`;
let inventory=[];
function parseCSV(text){const lines=text.trim().split(/\r?\n/);const headers=lines.shift().split(',').map(h=>h.trim().replace(/^"|"$/g,''));return lines.filter(Boolean).map(line=>{const cells=[];let cur='',q=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'&&line[i+1]==='"'){cur+='"';i++;}else if(c==='"'){q=!q;}else if(c===','&&!q){cells.push(cur);cur='';}else cur+=c;}cells.push(cur);let o={};headers.forEach((h,i)=>o[h]=(cells[i]||'').trim());return o;});}
function money(v){if(!v)return '';const n=Number(String(v).replace(/[^0-9.-]/g,''));return isNaN(n)?v:n.toLocaleString('en-US',{style:'currency',currency:'USD'});}
function render(){const q=document.getElementById('search').value.toLowerCase();const data=inventory.filter(i=>Object.values(i).join(' ').toLowerCase().includes(q));document.getElementById('count').textContent=data.length;document.getElementById('qty').textContent=data.reduce((s,i)=>s+(Number(i['Qty on Hand']||i.qty||0)||0),0);document.getElementById('rows').innerHTML=data.map(i=>{const qty=Number(i['Qty on Hand']||0)||0;return `<tr><td>${i.Name||''}</td><td>${i['Sales Description']||''}</td><td class="${qty<=0?'low':'ok'}">${qty}</td><td>${i.Category||''}</td><td>${i.SKU||''}</td><td class="price">${money(i.Price||'')}</td></tr>`}).join('');}
async function load(){try{const r=await fetch(CSV_URL+'&cache='+Date.now());if(!r.ok)throw new Error('Planilha não publicada');inventory=parseCSV(await r.text());document.getElementById('message').style.display='none';render();}catch(e){document.getElementById('message').innerHTML='Não consegui ler a planilha online. Abra a planilha, clique em <b>Compartilhar</b> e deixe como <b>Qualquer pessoa com o link pode visualizar</b>.';}}
document.getElementById('search').addEventListener('input',render);load();setInterval(load,60000);
</script>
</body>
</html>
