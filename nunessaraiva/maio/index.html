<!DOCTYPE html><html lang='pt-BR'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Nunes Saraiva Advogados | 20 Conteúdos Maio</title><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');body{margin:0;background:#050505;color:#e7d19a;font-family:Inter,Arial,sans-serif;line-height:1.65}header{padding:55px 24px;text-align:center;background:radial-gradient(circle at top,#1a1a1a,#050505 65%)}.logo{font-size:68px;font-weight:900;letter-spacing:-.08em;color:#d4af5a}.brand{letter-spacing:.22em;text-transform:uppercase;color:#d4af5a;font-weight:800}.wrap{max-width:1120px;margin:auto;padding:28px}h1{font-size:clamp(40px,7vw,74px);line-height:.96;color:#fff;margin:18px 0}h1 span{color:#d4af5a}.intro{max-width:850px;margin:auto;color:#c9b87d;font-size:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:28px 0}.metric{background:#111;border:1px solid rgba(212,175,90,.22);border-radius:22px;padding:20px}.metric b{display:block;color:#fff;font-size:38px}.metric span{color:#c9b87d;font-weight:700}details{background:#101010;border:1px solid rgba(212,175,90,.22);border-radius:24px;padding:0;margin:16px 0;overflow:hidden}summary{list-style:none;cursor:pointer;color:#fff;font-size:22px;font-weight:900;padding:24px 26px;display:flex;justify-content:space-between;gap:18px}summary::-webkit-details-marker{display:none}summary:after{content:'+';color:#d4af5a;font-size:30px}details[open] summary:after{content:'—'}.inside{padding:0 26px 28px}.box{background:#191919;border:1px solid rgba(212,175,90,.1);border-radius:18px;padding:18px;margin:12px 0;white-space:pre-line}.box b{color:#fff}.fala{background:#221a10;border-color:rgba(212,175,90,.28);color:#f4e3b0}.tag{display:inline-block;background:#d4af5a;color:#050505;padding:7px 12px;border-radius:999px;font-weight:900;margin:8px 8px 8px 0}.small{color:#bca977}footer{text-align:center;padding:40px;color:#8f7d52;font-weight:800}@media(max-width:800px){.grid{grid-template-columns:1fr}summary{font-size:18px}}</style></head><body><header><div class='logo'>NS</div><div class='brand'>Nunes Saraiva Advogados</div><h1>20 temas com <span>falas prontas</span></h1><p class='intro'>Conteúdos estruturados para redes sociais com começo, meio e fim. Cada tema traz título, conteúdo, objetivo e a fala exata para gravar vídeos de 30 a 90 segundos.</p></header><main class='wrap'><div class='grid'><div class='metric'><b>20</b><span>temas completos</span></div><div class='metric'><b>30-90s</b><span>tempos variados</span></div><div class='metric'><b>Reels</b><span>roteiros para gravação</span></div></div>
